<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Reviews</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #282e33);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #313b43);
            --text: var(--tg-theme-text-color, #f5f5f5);
            --hint: var(--tg-theme-hint-color, #82868a);
            --link: var(--tg-theme-link-color, #4be1c3);
            --accent: var(--tg-theme-accent-text-color, #79e8da);
            --button: var(--tg-theme-button-color, #3fc1b0);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --section-separator: var(--tg-theme-section-separator-color, #242a2e);
            --header-bg: var(--tg-theme-header-bg-color, #282e33);
            --section-bg: var(--tg-theme-section-bg-color, #282e33);
            --subtitle: var(--tg-theme-subtitle-text-color, #82868a);
            --good: #31a357;
            --bad: #ff5252;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .app {
            max-width: 480px;
            margin: 0 auto;
        }

        /* ===== PROFILE ===== */
        .profile-widget {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 16px 28px;
            text-align: center;
            border-radius: 24px;
            position: relative;
            overflow: hidden;
        }

        .profile-bg {
            position: absolute;
            inset: 0;
            background: transparent;
            z-index: 0;
        }

        .profile-widget > *:not(.profile-bg) { position: relative; z-index: 1; }

        .avatar {
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 500;
            flex-shrink: 0;
        }

        .avatar-large {
            width: 80px;
            height: 80px;
            font-size: 36px;
            margin-bottom: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
        }

        .profile-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
            line-height: 1.3;
        }

        .profile-date {
            font-size: 15px;
            color: var(--hint);
            line-height: 1.4;
        }

        /* ===== STICKY TABS ===== */
        .tabs-container {
            display: flex;
            align-items: stretch;
            justify-content: center;
            border-bottom: 1px solid var(--section-separator);
            min-width: 100%;
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .tab {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 13px 8px;
            cursor: pointer;
            position: relative;
            font-size: 15px;
            font-weight: 600;
            color: var(--hint);
            transition: color 0.2s ease, opacity 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            white-space: nowrap;
            text-align: center;
        }

        .tab:active { opacity: 0.7; }

        .tab::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            border-radius: 2px 2px 0 0;
            background: transparent;
            transition: background-color 0.25s ease;
        }

        .tab.active { color: var(--text); }
        .tab[data-tab="all"].active::after { background-color: var(--button); }
        .tab[data-tab="positive"].active::after { background-color: var(--good); }
        .tab[data-tab="negative"].active::after { background-color: var(--bad); }

        .tab-thumb {
            display: flex;
            align-items: center;
        }

        .tab-thumb svg {
            width: 22px;
            height: 22px;
        }

        /* ===== REVIEWS LIST ===== */
        .reviews-list {
            list-style: none;
            padding-bottom: 24px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .review-item {
            display: flex;
            gap: 12px;
            align-items: stretch;
            padding: 0 16px;
            animation: fadeInUp 0.3s ease both;
        }

        .review-avatar-col {
            display: flex;
            flex-shrink: 0;
            padding: 12px 0;
            align-items: flex-start;
        }

        .review-avatar {
            width: 42px;
            height: 42px;
            font-size: 18px;
        }

        .review-content {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            padding: 12px 0;
            gap: 3px;
            overflow: hidden;
            min-width: 0;
        }

        .review-item:not(:first-child) .review-content {
            border-top: 0.5px solid var(--section-separator);
        }

        .review-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .review-username {
            font-size: 16px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: 1.3;
        }

        .review-status {
            font-size: 13px;
            white-space: nowrap;
            flex-shrink: 0;
            letter-spacing: 0.01em;
        }

        .review-status.positive { color: var(--good); }
        .review-status.negative { color: var(--bad); }

        .review-text {
            font-size: 15px;
            color: var(--subtitle);
            line-height: 1.45;
            word-break: break-word;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 56px 16px;
            color: var(--hint);
            font-size: 15px;
            animation: fadeInUp 0.3s ease both;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        /* ===== AVATAR COLORS ===== */
        .avatar-color-0 { background: linear-gradient(135deg, #72d5fd 0%, #2a9ef1 100%); }
        .avatar-color-1 { background: linear-gradient(135deg, #e0a2f3 0%, #d669ed 100%); }
        .avatar-color-2 { background: linear-gradient(135deg, #82b1ff 0%, #665fff 100%); }
        .avatar-color-3 { background: linear-gradient(135deg, #ffcd6a 0%, #ffa85c 100%); }
        .avatar-color-4 { background: linear-gradient(135deg, #6dd98e 0%, #35c759 100%); }
        .avatar-color-5 { background: linear-gradient(135deg, #ff8a8a 0%, #e85656 100%); }
        .avatar-color-6 { background: linear-gradient(135deg, #53edd6 0%, #28c9b7 100%); }

        /* ===== REVIEW FORM ===== */
        .review-form {
            padding: 6px 8px;
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .review-form-input {
            flex: 1;
            display: flex;
            align-items: flex-end;
            background: var(--secondary-bg);
            border: none;
            border-radius: 21px;
            min-height: 42px;
            overflow: hidden;
        }

        .review-form-input textarea {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 16px;
            color: var(--text);
            font-family: inherit;
            font-size: 16px;
            resize: none;
            min-height: 42px;
            max-height: 120px;
            outline: none;
            line-height: 1.35;
            overflow-y: auto;
        }

        .review-form-input textarea::placeholder {
            color: var(--hint);
        }

        .review-form-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--button);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .review-form-btn:active {
            transform: scale(0.9);
            opacity: 0.8;
        }

        .review-form-btn svg {
            width: 26px;
            height: 26px;
            fill: var(--button-text);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--secondary-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: var(--text);
            padding: 12px 22px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 4px 24px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.06);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 999;
            max-width: calc(100vw - 32px);
            text-align: center;
            line-height: 1.4;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast-icon {
            width: 18px;
            height: 18px;
            vertical-align: -3px;
            margin-right: 7px;
            color: #e8a030;
            flex-shrink: 0;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
    </style>
</head>
<body>
    <div class="app" id="app"></div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('secondary_bg_color');
            tg.setBackgroundColor('bg_color');
        }

        function haptic(type) {
            if (tg && tg.HapticFeedback) {
                if (type === 'light') tg.HapticFeedback.impactOccurred('light');
                else if (type === 'select') tg.HapticFeedback.selectionChanged();
            }
        }

        const THUMB_UP = `<svg viewBox="0 0 24 24" fill="none"><path d="M8.32 11.04s-.49.72-1.93.6C5.22 11.53 4.4 14.38 5.01 16.52c.45 1.57 1.38 2.11 2.18 1.91.45-.11 1.09-.25 1.4-.2 2.41.41 3.22-8.79-.27-7.19Z" fill="#FCCD2C"/><path d="M7.84 14.46s-.61-1.81.71-3.75c1.29-1.94 2.49-2.32 2.69-3.15.33-1.32-.36-2.54.46-2.98.9-.5 2.04.51 2.17 2.06.13 1.56-.81 2.49-.69 3.34.12.84 1.49.5 2.69.62 1.47.1 2.47.51 2.77 1.41.2.8.3 1.3 0 1.9-.2.5-.1.7 0 1.2.1.6 0 1.1-.3 1.5-.2.3-.2.4-.1.8.1.7-.3 1.4-1.1 1.5-.5.1-3.6.1-4.3-.1-.9-.2-1.4-.7-1.6-1.4-.1-.8 0-2.5-.1-3.8Z" fill="#FCCD2C"/></svg>`;

        const THUMB_DOWN = `<svg viewBox="0 0 24 24" fill="none" style="transform:scaleY(-1)"><path d="M8.32 11.04s-.49.72-1.93.6C5.22 11.53 4.4 14.38 5.01 16.52c.45 1.57 1.38 2.11 2.18 1.91.45-.11 1.09-.25 1.4-.2 2.41.41 3.22-8.79-.27-7.19Z" fill="#FF5252"/><path d="M7.84 14.46s-.61-1.81.71-3.75c1.29-1.94 2.49-2.32 2.69-3.15.33-1.32-.36-2.54.46-2.98.9-.5 2.04.51 2.17 2.06.13 1.56-.81 2.49-.69 3.34.12.84 1.49.5 2.69.62 1.47.1 2.47.51 2.77 1.41.2.8.3 1.3 0 1.9-.2.5-.1.7 0 1.2.1.6 0 1.1-.3 1.5-.2.3-.2.4-.1.8.1.7-.3 1.4-1.1 1.5-.5.1-3.6.1-4.3-.1-.9-.2-1.4-.7-1.6-1.4-.1-.8 0-2.5-.1-3.8Z" fill="#FF5252"/></svg>`;

        function getDataFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const raw = params.get('data');
            if (!raw) return null;
            try { return JSON.parse(raw); } catch { return null; }
        }

        function getInitial(name) {
            if (!name) return '?';
            const trimmed = name.trim();
            if (!trimmed) return '?';
            const emojiRegex = /^[\p{Emoji_Presentation}\p{Extended_Pictographic}]/u;
            const match = trimmed.match(emojiRegex);
            if (match) return match[0];
            return trimmed[0].toUpperCase();
        }

        function avatarColorClass(name) {
            if (!name) return 'avatar-color-0';
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            return 'avatar-color-' + (Math.abs(hash) % 7);
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        function render(data) {
            const app = document.getElementById('app');
            if (!data) {
                app.innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#128196;</div>Нет данных</div>';
                return;
            }

            const { seller, reviews } = data;
            const allCount = reviews.length;
            const positiveCount = reviews.filter(r => r.status === 1).length;
            const negativeCount = reviews.filter(r => r.status === 0).length;

            app.innerHTML = `
                <div class="profile-widget">
                    <div class="profile-bg"></div>
                    <div class="avatar avatar-large avatar-color-6">${escapeHtml(getInitial(seller.full_name))}</div>
                    <div class="profile-name">${escapeHtml(seller.full_name)}</div>
                    <div class="profile-date">${seller.registrationDate ? 'Зарегистрирован(а) ' + escapeHtml(seller.registrationDate) : ''}</div>
                </div>

                <div class="review-form">
                    <div class="review-form-input">
                        <textarea id="reviewInput" placeholder="Написать отзыв..." rows="1"></textarea>
                    </div>
                    <button class="review-form-btn" id="reviewSubmit" aria-label="Отправить">
                        <svg viewBox="0 0 128 128"><path d="M28.97,63.32C47.63,55.2,60.07,49.84,66.29,47.25C84.07,39.86,87.76,38.57,90.17,38.53C90.7,38.52,91.88,38.65,92.65,39.27C93.29,39.8,93.47,40.51,93.56,41.01C93.64,41.5,93.75,42.64,93.67,43.53C92.7,53.65,88.53,78.2,86.41,89.54C85.52,94.33,83.75,95.94,82.04,96.1C78.32,96.44,75.5,93.64,71.9,91.28C66.27,87.59,63.09,85.29,57.62,81.69C51.3,77.53,55.4,75.24,59,71.5C59.94,70.52,76.32,55.62,76.63,54.27C76.67,54.1,76.71,53.47,76.33,53.14C75.96,52.81,75.41,52.92,75.01,53.01C74.44,53.14,65.45,59.09,48.01,70.86C45.46,72.61,43.15,73.46,41.07,73.42C38.79,73.37,34.39,72.13,31.12,71.06C27.12,69.76,23.93,69.07,24.21,66.86C24.35,65.71,25.94,64.53,28.97,63.32Z"/></svg>
                    </button>
                </div>

                <div class="tabs-container">
                    <div class="tab active" data-tab="all">
                        <span>Все &middot; ${allCount}</span>
                    </div>
                    <div class="tab" data-tab="positive">
                        <span class="tab-thumb">${THUMB_UP}</span>
                        <span>${positiveCount}</span>
                    </div>
                    <div class="tab" data-tab="negative">
                        <span class="tab-thumb">${THUMB_DOWN}</span>
                        <span>${negativeCount}</span>
                    </div>
                </div>

                <ul class="reviews-list" id="reviewsList"></ul>
            `;

            let currentFilter = 'all';
            const tabs = document.querySelectorAll('.tab');
            const list = document.getElementById('reviewsList');

            function renderReviews(filter) {
                let filtered = reviews;
                if (filter === 'positive') filtered = reviews.filter(r => r.status === 1);
                else if (filter === 'negative') filtered = reviews.filter(r => r.status === 0);

                if (filtered.length === 0) {
                    list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#128203;</div>Нет отзывов</div>';
                    return;
                }

                list.innerHTML = filtered.map((r, i) => {
                    const initial = getInitial(r.full_name);
                    const colorCls = avatarColorClass(r.full_name);
                    const isPositive = r.status === 1;
                    const statusText = isPositive ? 'положительный' : 'отрицательный';
                    const statusCls = isPositive ? 'positive' : 'negative';
                    const textHtml = r.text ? `<div class="review-text">${escapeHtml(r.text)}</div>` : '';
                    const delay = Math.min(i * 0.03, 0.5);

                    return `
                        <li class="review-item" style="animation-delay:${delay}s">
                            <div class="review-avatar-col">
                                <div class="avatar review-avatar ${colorCls}">${escapeHtml(initial)}</div>
                            </div>
                            <div class="review-content">
                                <div class="review-header">
                                    <span class="review-username">${escapeHtml(r.full_name)}</span>
                                    <span class="review-status ${statusCls}">${statusText}</span>
                                </div>
                                ${textHtml}
                            </div>
                        </li>
                    `;
                }).join('');
            }

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    if (tab.classList.contains('active')) return;
                    haptic('select');
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentFilter = tab.dataset.tab;
                    renderReviews(currentFilter);
                });
            });

            renderReviews('all');

            // Форма отзыва
            const textarea = document.getElementById('reviewInput');
            const submitBtn = document.getElementById('reviewSubmit');

            textarea.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });

            submitBtn.addEventListener('click', () => {
                haptic('light');
                showToast('<svg class="toast-icon" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.5"/><line x1="10" y1="6" x2="10" y2="11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="14" r="1" fill="currentColor"/></svg>Отзыв можно оставить только после покупки.');
            });
        }

        let toastTimer = null;
        function showToast(msg) {
            let toast = document.getElementById('toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast';
                toast.className = 'toast';
                document.body.appendChild(toast);
            }
            toast.innerHTML = msg;
            clearTimeout(toastTimer);
            toast.classList.add('show');
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
        }

        render(getDataFromUrl());
    </script>
</body>
</html>

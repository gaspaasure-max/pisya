<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reviews</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #282e33);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #313b43);
            --text: var(--tg-theme-text-color, #f5f5f5);
            --hint: var(--tg-theme-hint-color, #82868a);
            --link: var(--tg-theme-link-color, #4be1c3);
            --accent: var(--tg-theme-accent-text-color, #79e8da);
            --button: var(--tg-theme-button-color, #3fc1b0);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --section-separator: var(--tg-theme-section-separator-color, #242a2e);
            --header-bg: var(--tg-theme-header-bg-color, #282e33);
            --section-bg: var(--tg-theme-section-bg-color, #282e33);
            --subtitle: var(--tg-theme-subtitle-text-color, #82868a);
            --good: #31a357;
            --bad: #ff5252;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .app {
            max-width: 480px;
            margin: 0 auto;
        }

        /* ===== PROFILE ===== */
        .profile-widget {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 16px 28px;
            text-align: center;
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            margin: 8px 12px 0;
            background: transparent;
        }

        .avatar {
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 500;
            flex-shrink: 0;
        }

        .avatar-large {
            width: 80px;
            height: 80px;
            font-size: 36px;
            margin-bottom: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
        }

        .profile-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
            line-height: 1.3;
        }

        .profile-date {
            font-size: 15px;
            color: var(--hint);
            line-height: 1.4;
        }

        /* ===== STICKY TABS ===== */
        .tabs-container {
            display: flex;
            align-items: stretch;
            justify-content: center;
            border-bottom: 1px solid var(--section-separator);
            min-width: 100%;
            position: sticky;
            top: 0;
            z-index: 10;
            background: color-mix(in srgb, var(--bg) 85%, transparent);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .tab {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 13px 8px;
            cursor: pointer;
            position: relative;
            font-size: 15px;
            font-weight: 600;
            color: var(--hint);
            transition: color 0.2s ease, opacity 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            white-space: nowrap;
            text-align: center;
        }

        .tab:active { opacity: 0.7; }

        .tab::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            border-radius: 2px 2px 0 0;
            background: transparent;
            transition: background-color 0.25s ease;
        }

        .tab.active { color: var(--text); }
        .tab[data-tab="all"].active::after { background-color: var(--button); }
        .tab[data-tab="positive"].active::after { background-color: var(--good); }
        .tab[data-tab="negative"].active::after { background-color: var(--bad); }

        .tab-thumb {
            display: flex;
            align-items: center;
        }

        .tab-thumb svg {
            width: 22px;
            height: 22px;
        }

        /* ===== REVIEWS LIST ===== */
        .reviews-list {
            list-style: none;
            padding-bottom: 72px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .review-item {
            display: flex;
            gap: 12px;
            align-items: stretch;
            padding: 0 16px;
            animation: fadeInUp 0.3s ease both;
            contain: content;
        }

        .review-avatar-col {
            display: flex;
            flex-shrink: 0;
            padding: 12px 0;
            align-items: flex-start;
        }

        .review-avatar {
            width: 42px;
            height: 42px;
            font-size: 18px;
        }

        .review-content {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            padding: 12px 0;
            gap: 3px;
            overflow: hidden;
            min-width: 0;
        }

        .review-item:not(:first-child) .review-content {
            position: relative;
        }
        .review-item:not(:first-child) .review-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--section-separator);
            transform: scaleY(0.5);
            transform-origin: top;
        }

        .review-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .review-username {
            font-size: 16px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: 1.3;
        }

        .review-status {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .review-status svg {
            width: 18px;
            height: 18px;
        }

        .review-text {
            font-size: 15px;
            color: var(--subtitle);
            line-height: 1.45;
            word-break: break-word;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 56px 16px;
            color: var(--hint);
            font-size: 15px;
            animation: fadeInUp 0.3s ease both;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        /* ===== AVATAR COLORS ===== */
        .avatar-color-0 { background: linear-gradient(135deg, #72d5fd 0%, #2a9ef1 100%); }
        .avatar-color-1 { background: linear-gradient(135deg, #e0a2f3 0%, #d669ed 100%); }
        .avatar-color-2 { background: linear-gradient(135deg, #82b1ff 0%, #665fff 100%); }
        .avatar-color-3 { background: linear-gradient(135deg, #ffcd6a 0%, #ffa85c 100%); }
        .avatar-color-4 { background: linear-gradient(135deg, #6dd98e 0%, #35c759 100%); }
        .avatar-color-5 { background: linear-gradient(135deg, #ff8a8a 0%, #e85656 100%); }
        .avatar-color-6 { background: linear-gradient(135deg, #53edd6 0%, #28c9b7 100%); }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

        /* ===== INPUT BAR ===== */
        .input-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px 12px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            background: transparent;
            z-index: 20;
            display: flex;
            align-items: center;
        }
        .tg-icon svg {
            width: 20px;
            height: 20px;
            display: block;
        }
        .input-wrap {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            background: color-mix(in srgb, var(--bg) 85%, transparent);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 22px;
        }
        .input-field {
            width: 100%;
            padding: 10px 40px 10px 16px;
            border-radius: 22px;
            border: 1px solid var(--section-separator);
            outline: none;
            background: color-mix(in srgb, var(--secondary-bg) 60%, transparent);
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
        }
        .input-field::placeholder {
            color: var(--hint);
        }
        .send-btn {
            position: absolute;
            right: -4px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 3px solid color-mix(in srgb, var(--bg) 85%, transparent);
            background: var(--button);
            color: var(--button-text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, opacity 0.15s;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            -webkit-tap-highlight-color: transparent;
        }
        .send-btn:active {
            transform: scale(0.9);
            opacity: 0.8;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--secondary-bg);
            border: 1px solid var(--section-separator);
            color: var(--text);
            padding: 10px 18px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 30;
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="app" id="app"></div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2Zm0 15a1 1 0 1 1 0-2 1 1 0 0 1 0 2Zm1-4.5a1 1 0 0 1-2 0v-4a1 1 0 0 1 2 0v4Z" fill="#ff9800"/></svg>
        <span>Отзывы доступны после покупки</span>
    </div>

    <!-- Нижняя панель ввода -->
    <div class="input-bar">
        <div class="input-wrap">
            <input type="text" class="input-field" placeholder="Написать отзыв...">
            <button class="send-btn" type="button">
                <span class="tg-icon">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M3.51 11.37l16.76-7.07c.75-.32 1.52.34 1.3 1.13l-3.39 12.34c-.23.83-1.23 1.08-1.82.46l-3.04-3.21-1.66 2.03c-.36.44-1.07.2-1.07-.36v-3.4L3.8 13.1c-.82-.18-.89-1.34-.08-1.63l-.21-.1Z" fill="currentColor"/>
                    </svg>
                </span>
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('secondary_bg_color');
            tg.setBackgroundColor('bg_color');
        }

        function haptic(type) {
            if (tg && tg.HapticFeedback) {
                if (type === 'light') tg.HapticFeedback.impactOccurred('light');
                else if (type === 'select') tg.HapticFeedback.selectionChanged();
                else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            haptic('error');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        document.querySelector('.send-btn').addEventListener('click', () => {
            showToast();
            document.querySelector('.input-field').focus();
        });
        document.querySelector('.input-field').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') showToast();
        });

        const THUMB_UP = `<svg viewBox="0 0 24 24" fill="none"><path d="M8.32 11.04s-.49.72-1.93.6C5.22 11.53 4.4 14.38 5.01 16.52c.45 1.57 1.38 2.11 2.18 1.91.45-.11 1.09-.25 1.4-.2 2.41.41 3.22-8.79-.27-7.19Z" fill="#FCCD2C"/><path d="M7.84 14.46s-.61-1.81.71-3.75c1.29-1.94 2.49-2.32 2.69-3.15.33-1.32-.36-2.54.46-2.98.9-.5 2.04.51 2.17 2.06.13 1.56-.81 2.49-.69 3.34.12.84 1.49.5 2.69.62 1.47.1 2.47.51 2.77 1.41.2.8.3 1.3 0 1.9-.2.5-.1.7 0 1.2.1.6 0 1.1-.3 1.5-.2.3-.2.4-.1.8.1.7-.3 1.4-1.1 1.5-.5.1-3.6.1-4.3-.1-.9-.2-1.4-.7-1.6-1.4-.1-.8 0-2.5-.1-3.8Z" fill="#FCCD2C"/></svg>`;

        const THUMB_DOWN = `<svg viewBox="0 0 24 24" fill="none" style="transform:scaleY(-1)"><path d="M8.32 11.04s-.49.72-1.93.6C5.22 11.53 4.4 14.38 5.01 16.52c.45 1.57 1.38 2.11 2.18 1.91.45-.11 1.09-.25 1.4-.2 2.41.41 3.22-8.79-.27-7.19Z" fill="#FF5252"/><path d="M7.84 14.46s-.61-1.81.71-3.75c1.29-1.94 2.49-2.32 2.69-3.15.33-1.32-.36-2.54.46-2.98.9-.5 2.04.51 2.17 2.06.13 1.56-.81 2.49-.69 3.34.12.84 1.49.5 2.69.62 1.47.1 2.47.51 2.77 1.41.2.8.3 1.3 0 1.9-.2.5-.1.7 0 1.2.1.6 0 1.1-.3 1.5-.2.3-.2.4-.1.8.1.7-.3 1.4-1.1 1.5-.5.1-3.6.1-4.3-.1-.9-.2-1.4-.7-1.6-1.4-.1-.8 0-2.5-.1-3.8Z" fill="#FF5252"/></svg>`;

        const THUMB_UP_SM = `<svg viewBox="0 0 24 24" fill="none"><path d="M8.32 11.04s-.49.72-1.93.6C5.22 11.53 4.4 14.38 5.01 16.52c.45 1.57 1.38 2.11 2.18 1.91.45-.11 1.09-.25 1.4-.2 2.41.41 3.22-8.79-.27-7.19Z" fill="#31a357"/><path d="M7.84 14.46s-.61-1.81.71-3.75c1.29-1.94 2.49-2.32 2.69-3.15.33-1.32-.36-2.54.46-2.98.9-.5 2.04.51 2.17 2.06.13 1.56-.81 2.49-.69 3.34.12.84 1.49.5 2.69.62 1.47.1 2.47.51 2.77 1.41.2.8.3 1.3 0 1.9-.2.5-.1.7 0 1.2.1.6 0 1.1-.3 1.5-.2.3-.2.4-.1.8.1.7-.3 1.4-1.1 1.5-.5.1-3.6.1-4.3-.1-.9-.2-1.4-.7-1.6-1.4-.1-.8 0-2.5-.1-3.8Z" fill="#31a357"/></svg>`;

        const THUMB_DOWN_SM = `<svg viewBox="0 0 24 24" fill="none" style="transform:scaleY(-1)"><path d="M8.32 11.04s-.49.72-1.93.6C5.22 11.53 4.4 14.38 5.01 16.52c.45 1.57 1.38 2.11 2.18 1.91.45-.11 1.09-.25 1.4-.2 2.41.41 3.22-8.79-.27-7.19Z" fill="#ff5252"/><path d="M7.84 14.46s-.61-1.81.71-3.75c1.29-1.94 2.49-2.32 2.69-3.15.33-1.32-.36-2.54.46-2.98.9-.5 2.04.51 2.17 2.06.13 1.56-.81 2.49-.69 3.34.12.84 1.49.5 2.69.62 1.47.1 2.47.51 2.77 1.41.2.8.3 1.3 0 1.9-.2.5-.1.7 0 1.2.1.6 0 1.1-.3 1.5-.2.3-.2.4-.1.8.1.7-.3 1.4-1.1 1.5-.5.1-3.6.1-4.3-.1-.9-.2-1.4-.7-1.6-1.4-.1-.8 0-2.5-.1-3.8Z" fill="#ff5252"/></svg>`;

        function getDataFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const raw = params.get('data');
            if (!raw) return null;
            try { return JSON.parse(raw); } catch { return null; }
        }

        function getInitial(name) {
            if (!name) return '?';
            const trimmed = name.trim();
            if (!trimmed) return '?';
            const emojiRegex = /^[\p{Emoji_Presentation}\p{Extended_Pictographic}]/u;
            const match = trimmed.match(emojiRegex);
            if (match) return match[0];
            return trimmed[0].toUpperCase();
        }

        function avatarColorClass(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            return 'avatar-color-' + (Math.abs(hash) % 7);
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function render(data) {
            const app = document.getElementById('app');
            if (!data) {
                app.innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#128196;</div>Нет данных</div>';
                return;
            }

            const { seller, reviews } = data;
            const allCount = reviews.length;
            let positiveCount = 0, negativeCount = 0;
            for (const r of reviews) {
                if (r.status === 1) positiveCount++;
                else if (r.status === 0) negativeCount++;
            }

            app.innerHTML = `
                <div class="profile-widget">
                    <div class="avatar avatar-large ${avatarColorClass(seller.full_name)}">${escapeHtml(getInitial(seller.full_name))}</div>
                    <div class="profile-name">${escapeHtml(seller.full_name)}</div>
                    <div class="profile-date">${seller.registrationDate ? 'Зарегистрирован(а) ' + escapeHtml(seller.registrationDate) : ''}</div>
                </div>

                <div class="tabs-container">
                    <div class="tab active" data-tab="all">
                        <span>Все &middot; ${allCount}</span>
                    </div>
                    <div class="tab" data-tab="positive">
                        <span class="tab-thumb">${THUMB_UP}</span>
                        <span>${positiveCount}</span>
                    </div>
                    <div class="tab" data-tab="negative">
                        <span class="tab-thumb">${THUMB_DOWN}</span>
                        <span>${negativeCount}</span>
                    </div>
                </div>

                <ul class="reviews-list" id="reviewsList"></ul>
            `;

            let currentFilter = 'all';
            const tabs = document.querySelectorAll('.tab');
            const list = document.getElementById('reviewsList');

            function renderReviews(filter) {
                let filtered = reviews;
                if (filter === 'positive') filtered = reviews.filter(r => r.status === 1);
                else if (filter === 'negative') filtered = reviews.filter(r => r.status === 0);

                if (filtered.length === 0) {
                    list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#128203;</div>Нет отзывов</div>';
                    return;
                }

                list.innerHTML = filtered.map((r, i) => {
                    const initial = getInitial(r.full_name);
                    const colorCls = avatarColorClass(r.full_name);
                    const isPositive = r.status === 1;
                    const statusIcon = isPositive ? THUMB_UP_SM : THUMB_DOWN_SM;
                    const textHtml = r.text ? `<div class="review-text">${escapeHtml(r.text)}</div>` : '';
                    const delay = i < 20 ? i * 0.03 : 0;

                    return `
                        <li class="review-item" style="animation-delay:${delay}s">
                            <div class="review-avatar-col">
                                <div class="avatar review-avatar ${colorCls}">${escapeHtml(initial)}</div>
                            </div>
                            <div class="review-content">
                                <div class="review-header">
                                    <span class="review-username">${escapeHtml(r.full_name)}</span>
                                    <span class="review-status">${statusIcon}</span>
                                </div>
                                ${textHtml}
                            </div>
                        </li>
                    `;
                }).join('');
            }

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    if (tab.classList.contains('active')) return;
                    haptic('select');
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentFilter = tab.dataset.tab;
                    list.style.opacity = '0';
                    list.style.transition = 'opacity 0.15s ease';
                    setTimeout(() => {
                        renderReviews(currentFilter);
                        list.style.opacity = '1';
                    }, 150);
                });
            });

            renderReviews('all');
        }

        render(getDataFromUrl());
    </script>
</body>
</html>
